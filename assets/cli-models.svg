<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" role="img">
  <title>Model commands</title>
  <rect width="100%" height="100%" fill="#16181d"/>
  <rect x="8" y="8" width="704" height="624" fill="#22262e" stroke="#3c4452"/>
  <text x="24" y="28" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#7dcea0">Model commands</text><text x="24" y="48" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f0c674">SVG text of recorded command output, not a photograph.</text><text x="24" y="74" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm dag truth --expr 'xor(and(i0,i1),not(i0))' --bits 2</text><text x="24" y="92" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">00 1</text><text x="24" y="110" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">01 0</text><text x="24" y="128" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">10 1</text><text x="24" y="146" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">11 1</text><text x="24" y="164" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="182" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm gf mul 0x57 0x83</text><text x="24" y="200" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">0xc1</text><text x="24" y="218" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="236" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm analog solve --g '3,-1;-1,2' --i '1,0'</text><text x="24" y="254" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">V 0.400000000000 0.200000000000</text><text x="24" y="272" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">residual 0.000000e+00</text><text x="24" y="290" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="308" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm qasm sim build/asset-out/bell.qasm</text><text x="24" y="326" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">nqubits 2</text><text x="24" y="344" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">prob 00 0.500000000000</text><text x="24" y="362" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">prob 01 0.000000000000</text><text x="24" y="380" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">prob 10 0.000000000000</text><text x="24" y="398" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">prob 11 0.500000000000</text><text x="24" y="416" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">norm 1.000000000000</text><text x="24" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">note pre-measurement amplitudes; this simulator does not sample collapse</text><text x="24" y="452" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="470" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm smt check</text><text x="24" y="488" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">unsat</text><text x="24" y="506" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">note native reading of this fixed 8-state query, not an external solver proof</text><text x="24" y="524" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="542" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ kg -n -q examples/arrays.kg</text><text x="24" y="560" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">13</text><text x="24" y="578" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">[1 1 2 3]</text><text x="24" y="596" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text>
</svg>
