  <text x="24" y="28" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#7dcea0">Klong interpreter compared with tm oracle</text><text x="24" y="48" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f0c674">SVG text of recorded command output, not a photograph.</text><text x="24" y="74" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm oracle</text><text x="24" y="92" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">dot 13</text><text x="24" y="110" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">scan 1 1 2 3</text><text x="24" y="128" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 87 131 193</text><text x="24" y="146" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 83 1 83</text><text x="24" y="164" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 83 0 0</text><text x="24" y="182" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 255 2 229</text><text x="24" y="200" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 128 2 27</text><text x="24" y="218" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 1 1 1</text><text x="24" y="236" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 2 2 4</text><text x="24" y="254" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev cx 5 7</text><text x="24" y="272" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev ccx 3 7</text><text x="24" y="290" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev cswap 5 3</text><text x="24" y="308" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool and 0 1 0</text><text x="24" y="326" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool or 0 1 1</text><text x="24" y="344" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool xor 1 1 0</text><text x="24" y="362" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool not 0 1</text><text x="24" y="380" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text><text x="24" y="398" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ kg -n -q klong/oracle.kg</text><text x="24" y="416" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">dot 13</text><text x="24" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">scan 1 1 2 3</text><text x="24" y="452" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 87 131 193</text><text x="24" y="470" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 83 1 83</text><text x="24" y="488" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 83 0 0</text><text x="24" y="506" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 255 2 229</text><text x="24" y="524" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 128 2 27</text><text x="24" y="542" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 1 1 1</text><text x="24" y="560" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">gf 2 2 4</text><text x="24" y="578" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev cx 5 7</text><text x="24" y="596" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev ccx 3 7</text><text x="24" y="614" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">rev cswap 5 3</text><text x="24" y="632" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool and 0 1 0</text><text x="24" y="650" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">bool or 0 1 1</text><text x="24" y="668" font-family="DejaVu Sans Mono, 