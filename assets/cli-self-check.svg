<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="298" role="img">
  <title>Native self-check</title>
  <rect width="100%" height="100%" fill="#16181d"/>
  <rect x="8" y="8" width="1048" height="282" fill="#22262e" stroke="#3c4452"/>
  <text x="24" y="28" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#7dcea0">Native self-check</text><text x="24" y="48" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f0c674">SVG text of recorded command output, not a photograph.</text><text x="24" y="74" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#f0c674">$ tm self-check --out-dir build/asset-out</text><text x="24" y="92" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">DAG: canonical sharing verified; nodes=7; xor(and(i0,i1),not(i0)) all 4 inputs passed</text><text x="24" y="110" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">GF(2^8): 0x57*0x83=0xc1; identity; commutativity 65536; iterative=recursive; inverses 255</text><text x="24" y="128" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">REVERSIBLE: CX, Toffoli, Fredkin are 3-bit permutations and involutions</text><text x="24" y="146" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">QUANTUM: Bell (|00&gt;+|11&gt;)/sqrt(2); probabilities 0.5/0.5; norm 1</text><text x="24" y="164" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">ANALOG: resistor-network nodal solution V=(0.400,0.200) residual=0.000e+00</text><text x="24" y="182" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">SMT: involution counterexample query has 0 models over 8 states</text><text x="24" y="200" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">CIRCUIT: gf256 multiplier gates=223 inputs=16 outputs=8; exhaustive 65536 match</text><text x="24" y="218" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">GENERATED: build/asset-out/bell.qasm build/asset-out/reversible.qasm build/asset-out/reversible.smt2 build/asset-out/gf256.tmnl</text><text x="24" y="236" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3">PASS: all native checks</text><text x="24" y="254" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e7ecf3"></text>
</svg>
